services:
  postgres:
    image: postgres:16.1-alpine
    container_name: rewards-postgres
    env_file:
      - .env
    ports:
      - "${POSTGRESQL_EXT_PORT}:${POSTGRESQL_PORT}"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - rewards-postgres-data:/var/lib/postgresql/data
    networks:
      - rewards-network

  redis:
    image: redis/redis-stack:7.4.0-v0
    container_name: redis
    ports:
      - "${REDIS_EXT_PORT}:${REDIS_PORT}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    networks:
      - rewards-network

  rewards:
    container_name: rewards
    build:
      context: .
      dockerfile: ./.deploy/docker/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    networks:
      - rewards-network

volumes:
  rewards-postgres-data:

networks:
  rewards-network:
    external: true